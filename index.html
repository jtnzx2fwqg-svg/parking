<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
<title>基隆市騎樓開放機車停車查詢</title>
<style>
:root{color-scheme:light dark;--pg:#f2f2f7;--sheet:rgba(249,249,251,.94);--card:#fff;--tx:#1c1c1e;--sec:#8e8e93;--fill:rgba(118,118,128,.12);--tint:#007aff;--tintbg:rgba(0,122,255,.12);--ok:#248a3d;--okbg:rgba(52,199,89,.14);--wn:#c93400;--wnbg:rgba(255,149,0,.15);--line:rgba(60,60,67,.12);--ease:cubic-bezier(.32,.72,0,1)}
@media(prefers-color-scheme:dark){:root{--pg:#1c1c1e;--sheet:rgba(28,28,30,.95);--card:#2c2c2e;--tx:#f5f5f7;--sec:#98989f;--fill:rgba(118,118,128,.24);--tint:#0a84ff;--tintbg:rgba(10,132,255,.2);--ok:#30d158;--okbg:rgba(48,209,88,.16);--wn:#ff9f0a;--wnbg:rgba(255,159,10,.16);--line:rgba(235,235,245,.13)}}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--pg)}
body{color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC","Helvetica Neue",sans-serif;-webkit-tap-highlight-color:transparent;text-rendering:optimizeLegibility}
button,a,input{touch-action:manipulation}
button{color:inherit}
#map{position:fixed;inset:0;z-index:1;width:100%;height:100%;border:0;background:var(--pg)}
#ph{position:fixed;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;padding:20px 20px 55%;text-align:center;color:var(--sec);background:var(--pg);pointer-events:none}
#ph[hidden]{display:none}
#chip{position:fixed;z-index:4;left:12px;top:calc(env(safe-area-inset-top,0px) + 10px);padding:8px 13px;border:1px solid var(--line);border-radius:999px;background:var(--sheet);box-shadow:0 2px 12px rgba(0,0,0,.12);font-weight:650;font-size:14px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
#chip b{color:var(--tint)}
#side{position:fixed;z-index:5;left:0;right:0;bottom:0;height:min(90vh,780px);height:min(90dvh,780px);display:flex;flex-direction:column;background:var(--sheet);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;box-shadow:0 -8px 32px rgba(0,0,0,.14);transform:translate3d(0,50%,0);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);contain:layout style}
#side.anim{transition:transform .38s var(--ease)}
#grab{position:relative;flex:none;height:30px;display:flex;justify-content:center;align-items:center;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#grab:before{content:"";position:absolute;inset:0 0 auto;height:100%;}
#grab i{width:36px;height:5px;border-radius:3px;background:var(--sec);opacity:.42;pointer-events:none}
.sh{flex:none;padding:0 16px 8px}
#ttl{display:none;font-size:26px;letter-spacing:-.5px;font-weight:750;margin:12px 2px 12px}
.sf{display:flex;align-items:center;gap:9px;background:var(--fill);border:1px solid transparent;border-radius:13px;padding:0 12px;height:44px;transition:border-color .15s,background .15s}
.sf:focus-within{border-color:var(--tint);background:var(--card)}
.sf input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;color:var(--tx);font:inherit;font-size:16px}
.sf input::-webkit-search-cancel-button{cursor:pointer}
.sf button{border:0;background:transparent;color:var(--sec);padding:4px;font-size:16px}
.pills{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.pills::-webkit-scrollbar{display:none}
.pills button{flex:none;border:0;background:var(--fill);color:var(--tx);padding:7px 13px;border-radius:999px;font:inherit;font-size:14px;font-weight:550;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.pills button.on{background:var(--tint);color:#fff}
.pills button:focus-visible,.pt button:focus-visible,.card a:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
#scr{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:4px 16px calc(20px + env(safe-area-inset-bottom,0px));scrollbar-width:thin}
#msg{font-size:14px;padding:10px 13px;border-radius:12px;margin:0 0 10px;background:var(--fill);color:var(--sec)}
#msg:empty{display:none}
#msg.ok{background:var(--okbg);color:var(--ok)}#msg.no{background:var(--wnbg);color:var(--wn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.035);cursor:pointer}
.card:active{background:var(--fill)}
.card.on{border-color:var(--tint);box-shadow:inset 0 0 0 1px var(--tint)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.b{color:#fff;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:650;white-space:nowrap}
.r{font-size:17px;font-weight:650;letter-spacing:-.2px}
.s{font-size:12px;color:var(--sec);margin-left:6px}
.t{color:var(--sec);font-size:14px;margin-top:3px;overflow-wrap:anywhere}
.card a{color:var(--tint);font-size:14px;text-decoration:none;display:inline-block;margin-top:8px;padding:2px 0}
footer{font-size:12px;color:var(--sec);padding:10px 2px 0;line-height:1.6}
.pt{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pt button{border:0;background:var(--tintbg);color:var(--tint);border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;font-weight:650;cursor:pointer;min-height:34px}
.pt button.on{background:var(--tint);color:#fff}
@media(min-width:900px){
  #side{left:16px;right:auto;width:410px;top:calc(env(safe-area-inset-top,0px) + 16px);bottom:16px;height:auto;border:1px solid var(--line);border-radius:24px;transform:none!important;box-shadow:0 12px 40px rgba(0,0,0,.18)}
  #grab,#chip{display:none}#ttl{display:block}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="ph" role="status">地圖載入中…<br>若長時間空白，請確認網路，或改用 Safari／Chrome 開啟。</div>
<iframe id="map" title="基隆市停車路段地圖" allowfullscreen loading="eager" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<div id="chip" aria-label="停車路段總數">🛵 騎樓停車 <b>82</b> 處</div>
<section id="side" aria-label="停車路段查詢面板">
  <div id="grab" role="separator" aria-label="拖曳調整面板高度" aria-orientation="horizontal" tabindex="0"><i></i></div>
  <div class="sh">
    <h1 id="ttl">基隆騎樓機車停車</h1>
    <form id="search-form" class="sf" role="search">
      <span aria-hidden="true">🔍</span>
      <input id="q" type="search" placeholder="路名或門牌，例如：中正路150" autocomplete="off" enterkeyhint="search" aria-label="搜尋路名或門牌">
      <button id="clear-q" type="button" aria-label="清除搜尋" hidden>✕</button>
    </form>
    <div class="pills" id="pills" aria-label="依行政區篩選"></div>
  </div>
  <div id="scr" tabindex="0" aria-label="停車路段清單">
    <div id="msg" role="status" aria-live="polite"></div>
    <div id="list"></div>
    <footer>資料整理自基隆市政府「騎樓開放機車停車」路段清單，實際停車規定仍以市府最新公告及現場標示為準。地圖由 Google 地圖依門牌定位（需網路）。點選「起／中／迄」可切換查看路段不同門牌位置。</footer>
  </div>
</section>
<script>
'use strict';
const D=[
["仁愛區",[["孝四路","1號至30號",1,30],["港西街","13號至43號",13,43],["忠一路","7號至20號",7,20],["忠二路","1號至65號",1,65],["忠二路","2號至66號",2,66],["忠四路","32號至44號",32,44],["孝二路","21號至107號",21,107],["孝二路","42號至76號",42,76],["孝三路","13號至109號",13,109],["孝三路","14號至96號",14,96],["仁一路","187號至299號",187,299],["仁二路","1號至127號",1,127],["仁五路","1號至61號",1,61],["愛二路","3號至65號",3,65],["愛二路","24號至74號",24,74]]],
["中正區",[["義一路","1號至111號",1,111],["義一路","2號至148號",2,148],["義二路","1號至215號",1,215],["義二路","2號至258號",2,258],["信一路","154號至177號",154,177],["信二路","272號至298號",272,298],["信三路","3號至36號",3,36],["信三路","4號至43號",4,43],["信四路","2號至24號",2,24],["信四路","5號至31號",5,31],["信五路","1號至59號",1,59],["信五路","2號至30號",2,30],["信六路","3號至33號",3,33],["信六路","4號至38號",4,38],["信七路","1號至19號",1,19],["信七路","2號至22號",2,22],["正義路","1號至73號",1,73],["正義路","2號至88號",2,88],["中正路","2號至164號",2,164],["中正路","341號至623號",341,623],["中正路","482號至822號",482,822],["武昌街","1號至23號",1,23],["武昌街","2號至140號",2,140],["祥豐街","711號至853號",711,853],["中正路","97號至339號",97,339],["中正路","186號至478號",186,478],["祥豐街","1號至565號",1,565],["祥豐街","2號至216號",2,216]]],
["信義區",[["信一路","1號至150號",1,150],["信二路","1號至281號",1,281],["信二路","2號至16號",2,16],["義四路","1號至27號",1,27],["義四路","2號至26號",2,26],["深溪路","沿線兩側騎樓"],["深澳坑路","166號（凱撒社區前騎樓）",166,166],["東信路","40號至162號",40,162],["東信路","5號至81之2號",5,81],["東信路","37號至45號",37,45],["深澳坑路","8之41號至8之50號、10之6號、10之7號"],["義六路","15號、17號",15,17]]],
["七堵區",[["福一街","53號至99號",53,99],["福一街","58號至110號",58,110],["福二街","25號至107號",25,107],["福二街","82號至100號",82,100],["百一街","161號至173號",161,173]]],
["暖暖區",[["源遠路","296號至300號",296,300],["源遠路","341號至349號",341,349],["暖暖街","102號至108號",102,108],["暖暖街","190號至194號",190,194],["東勢街","6至6之31號",6,6]]],
["安樂區",[["麥金路","2號至66號",2,66],["麥金路","160號至220號",160,220],["樂利三街32巷","37至47號",37,47],["安樂路一段","137號至177號",137,177],["安一路","250號至260號",250,260],["安樂路二段","82號至132號",82,132],["安樂路二段","131號至235號",131,235],["安樂路一段","260號至278號",260,278]]],
["中山區",[["成功二路","43號至63號",43,63],["復興路","317號至323號",317,323],["安一路","18號至42號",18,42],["安一路","71號至87號",71,87],["西定路","28號至40號",28,40],["中和路","164巷13至19號、16至26號、168巷13弄1至37號、167至198號之4"],["德安路","2-2號、2-3號、2-5號、2-6號、2-10號、2-11號、2-12號、2-14號、2-15號"],["中和路","164巷1號、166號、166-1至166-6號"],["成功二路","65號",65,65]]]
];
const COL={仁愛區:'#ff2d55',中正區:'#007aff',信義區:'#34c759',七堵區:'#ff9500',暖暖區:'#af52de',安樂區:'#30b0c7',中山區:'#5856d6'};
const rows=[];
for(const [dist,items] of D)for(const [road,txt,lo,hi] of items)rows.push({id:rows.length+1,dist,road,txt,lo,hi,side:lo==null?'':(lo%2===hi%2?(lo%2?'單號側':'雙號側'):'')});
const $=id=>document.getElementById(id);
const norm=s=>String(s).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/臺/g,'台').replace(/\s+/g,'').replace(/號$/,'').toLowerCase();
const inRange=(r,x)=>r.lo!=null&&x>=r.lo&&x<=r.hi&&(r.lo%2!==r.hi%2||x%2===r.lo%2);
rows.forEach(r=>{r.h=norm(r.dist+r.road+r.txt);r.n=norm(r.dist+r.road)});
let dist='all',cur=null,selectedPoint=null,searchTimer=0;
const map=$('map'),ph=$('ph'),side=$('side'),grab=$('grab'),q=$('q'),scr=$('scr');
const mapUrl=q=>`https://www.google.com/maps?hl=zh-TW&z=18&output=embed&q=${encodeURIComponent(q)}`;
const addr=(r,x)=>'基隆市'+r.dist+r.road+(x!=null?x+'號':'');
const pts=r=>{if(r.lo==null)return[['路段',null]];if(r.lo===r.hi)return[['門牌',r.lo]];let mid=Math.round((r.lo+r.hi)/2);if(mid%2!==r.lo%2)mid++;if(mid>r.hi)mid-=2;return[['起',r.lo],['中',mid],['迄',r.hi]]};
function showMap(query){const url=mapUrl(query);if(map.dataset.url!==url){map.dataset.url=url;ph.hidden=false;map.src=url}}
map.addEventListener('load',()=>{ph.hidden=true});
showMap('基隆市');
const pills=$('pills');
[['all',`全部 (${rows.length})`],...D.map(([d,items])=>[d,`${d} (${items.length})`])].forEach(([value,label],index)=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.dataset.dist=value;b.classList.toggle('on',index===0);b.setAttribute('aria-pressed',String(index===0));b.addEventListener('click',()=>{dist=value;pills.querySelectorAll('button').forEach(btn=>{const active=btn===b;btn.classList.toggle('on',active);btn.setAttribute('aria-pressed',String(active))});render({keepScroll:true})});pills.appendChild(b)});
function render({keepScroll=false}={}){
  const query=norm(q.value),msg=$('msg');let out=rows.filter(r=>dist==='all'||r.dist===dist),kind='',message='';
  const match=query.match(/^([^\d]*\D)(\d+)$/);
  if(match){const name=match[1],number=Number(match[2]),byName=out.filter(r=>norm(r.n).includes(name));out=byName.filter(r=>inRange(r,number));if(out.length){kind='ok';message=`✓ ${name}${number}號：符合 ${out.length} 個開放路段`;showMap(addr(out[0],number))}else if(byName.length){kind='no';message=`${name}在清單中，但 ${number} 號不在可查詢的開放範圍內；請以最新公告為準`;out=byName}else{kind='no';message=`清單中找不到「${name}」`}}
  else{if(query)out=out.filter(r=>r.h.includes(query)||norm(r.road).includes(query));message=`符合 ${out.length} 筆路段`}
  msg.className=kind;msg.textContent=message;
  const previousScroll=scr.scrollTop;
  $('list').innerHTML=out.map(r=>`<article class="card${cur===r.id?' on':''}" data-id="${r.id}" tabindex="0" aria-label="${r.dist}${r.road}，${r.txt}"><div class="top"><span class="b" style="background:${COL[r.dist]}">${r.dist}</span><span class="s">編號 ${r.id}</span></div><div><span class="r">${r.road}</span><span class="s">${r.side}</span></div><div class="t">${r.txt}</div><div class="pt">${pts(r).map(([label,x])=>`<button type="button" data-point="${x==null?'':x}" aria-pressed="${cur===r.id&&selectedPoint===x}">📍 ${label}${x!=null&&label!=='門牌'?' '+x:''}</button>`).join('')}</div><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addr(r,r.lo))}" target="_blank" rel="noopener noreferrer">在 Google 地圖開啟 ↗</a></article>`).join('')||'<div class="card t" tabindex="0">找不到符合的路段，請嘗試其他路名或門牌。</div>';
  if(keepScroll)scr.scrollTop=previousScroll;
}
$('list').addEventListener('click',e=>{
  if(e.target.closest('a'))return;
  const card=e.target.closest('.card');if(!card||!card.dataset.id)return;
  const r=rows[Number(card.dataset.id)-1];if(!r)return;
  const pointButton=e.target.closest('.pt button');let x=r.lo;
  if(pointButton){x=pointButton.dataset.point===''?null:Number(pointButton.dataset.point);selectedPoint=x;card.querySelectorAll('.pt button').forEach(btn=>{const active=btn===pointButton;btn.classList.toggle('on',active);btn.setAttribute('aria-pressed',String(active))})}else selectedPoint=x;
  cur=r.id;document.querySelectorAll('.card.on').forEach(el=>el.classList.remove('on'));card.classList.add('on');
  showMap(addr(r,x));
  if(!isDesktop())snap(1);
});
$('list').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.card')){e.preventDefault();e.target.click()}});
function applySearch(){clearTimeout(searchTimer);render();$('clear-q').hidden=!q.value;}
q.addEventListener('input',()=>{clearTimeout(searchTimer);$('clear-q').hidden=!q.value;searchTimer=setTimeout(()=>render(),80)});
q.addEventListener('focus',()=>{if(!isDesktop())snap(0)});
$('clear-q').addEventListener('click',()=>{q.value='';applySearch();q.focus()});
$('search-form').addEventListener('submit',e=>{e.preventDefault();clearTimeout(searchTimer);render();q.blur();if(!isDesktop())snap(0)});
function isDesktop(){return window.matchMedia('(min-width:900px)').matches}
let pos=1,Y=0,raf=0,drag=null,snaps=[0,0,0];
function calcSnaps(){const viewport=Math.max(320,window.innerHeight);const panelHeight=side.offsetHeight||Math.min(viewport*.9,780);snaps=[0,Math.max(0,Math.round(panelHeight-viewport*.5)),Math.max(0,panelHeight-156)];if(snaps[1]>=snaps[2])snaps[1]=Math.max(0,snaps[2]*.55)}
function applyY(){raf=0;side.style.transform=`translate3d(0,${Math.round(Y*100)/100}px,0)`}
function cancelFrame(){if(raf){cancelAnimationFrame(raf);raf=0}}
function snap(index,animate=true){if(isDesktop())return;cancelFrame();calcSnaps();pos=Math.max(0,Math.min(2,index));Y=snaps[pos];side.classList.toggle('anim',animate);applyY()}
function cancelDrag(){if(!drag)return;cancelFrame();const old=drag;drag=null;try{if(grab.hasPointerCapture(old.pointerId))grab.releasePointerCapture(old.pointerId)}catch(_){}map.style.pointerEvents='';snap(pos)}
grab.addEventListener('pointerdown',e=>{if(isDesktop()||!e.isPrimary||e.button!==0)return;cancelFrame();calcSnaps();drag={pointerId:e.pointerId,startY:e.clientY,startOffset:Y,lastY:e.clientY,lastTime:e.timeStamp,velocity:0};try{grab.setPointerCapture(e.pointerId)}catch(_){}side.classList.remove('anim');map.style.pointerEvents='none';e.preventDefault()});
grab.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.pointerId)return;const max=snaps[2];Y=Math.max(0,Math.min(max,drag.startOffset+e.clientY-drag.startY));const dt=Math.max(1,e.timeStamp-drag.lastTime);drag.velocity=(e.clientY-drag.lastY)/dt;drag.lastY=e.clientY;drag.lastTime=e.timeStamp;if(!raf)raf=requestAnimationFrame(applyY)});
function finishDrag(e){if(!drag||e.pointerId!==drag.pointerId)return;const state=drag;cancelFrame();const projected=Y+state.velocity*160;let target=0;for(let i=1;i<snaps.length;i++)if(Math.abs(snaps[i]-projected)<Math.abs(snaps[target]-projected))target=i;drag=null;try{if(grab.hasPointerCapture(state.pointerId))grab.releasePointerCapture(state.pointerId)}catch(_){}map.style.pointerEvents='';snap(target)}
function abortDrag(){if(!drag)return;const state=drag;drag=null;cancelFrame();try{if(grab.hasPointerCapture(state.pointerId))grab.releasePointerCapture(state.pointerId)}catch(_){}map.style.pointerEvents='';snap(pos)}
grab.addEventListener('pointerup',finishDrag);grab.addEventListener('pointercancel',abortDrag);grab.addEventListener('lostpointercapture',()=>{if(drag)abortDrag()});window.addEventListener('blur',abortDrag);document.addEventListener('visibilitychange',()=>{if(document.hidden)abortDrag()});
grab.addEventListener('keydown',e=>{if(isDesktop())return;if(e.key==='ArrowUp'){e.preventDefault();snap(Math.max(0,pos-1))}else if(e.key==='ArrowDown'){e.preventDefault();snap(Math.min(2,pos+1))}else if(e.key==='Home'){e.preventDefault();snap(0)}else if(e.key==='End'){e.preventDefault();snap(2)}});
let resizeFrame=0;function onResize(){if(resizeFrame)cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(()=>{resizeFrame=0;if(isDesktop()){cancelFrame();drag=null;map.style.pointerEvents='';side.classList.remove('anim');side.style.transform=''}else if(!drag)snap(pos,false)})}
window.addEventListener('resize',onResize,{passive:true});if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{if(!q.matches(':focus')&&!drag&&!isDesktop())onResize()},{passive:true});
calcSnaps();snap(1,false);render();
</script>
